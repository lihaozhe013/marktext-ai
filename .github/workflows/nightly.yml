name: Build and publish nightly

on:
  push:
    branches:
      - build
      - publish

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      # Cache Electron binary; key on package.json so it busts when Electron version changes.
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      # Must be set before postinstall runs electron-rebuild
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: pnpm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mac builds are unsigned (no Developer ID); see release notes for the
      # user-side xattr/codesign workaround. Per-arch script: electron-builder's
      # --arm64/--x64 flags are additive over the config's arch list, so
      # electron-builder.yml must not pin mac.target arches for the flag to
      # actually restrict the build to a single arch.
      - name: Build macOS packages
        if: matrix.platform == 'macos'
        run: pnpm run build:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows packages
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: marktext-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish nightly release
    if: github.ref == 'refs/heads/publish'
    needs: build
    runs-on: ubuntu-latest
    # Per-job permissions REPLACE workflow-level ones, so re-declare
    # both: contents:write to publish the release, actions:read for
    # download-artifact's Actions API calls.
    permissions:
      contents: write
      actions: read

    steps:
      # upload-artifact treats `dist/` as the common-ancestor root and
      # stores files flat inside each artifact (no `dist/` prefix). Downloading
      # with `path: dist` + `merge-multiple` recreates `./dist/<file>` across
      # all platforms.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify build assets
        shell: bash
        run: |
          set -euo pipefail
          count="$(find dist -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' | wc -l | tr -d ' ')"
          if [[ "$count" -eq 0 ]]; then
            echo "No build assets were produced."
            exit 1
          fi
          echo "$count build assets found."

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          # Deterministic ordering so identical inputs always produce identical output
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - name: Compose release notes body
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "Automated nightly build for commit ${COMMIT_SHA:0:7}."
            echo ""
            echo "## ⚠️ Note for macOS users"
            echo "Builds are unsigned (no Apple Developer ID). After dragging MarkText into Applications, clear the quarantine flag once:"
            echo '```'
            echo 'xattr -cr /Applications/marktext.app'
            echo '```'
            echo ""
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      - name: Update nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag_lookup_ref="repos/${REPOSITORY}/git/ref/tags/nightly"
          tag_update_ref="repos/${REPOSITORY}/git/refs/tags/nightly"
          if gh api "${tag_lookup_ref}" >/dev/null 2>&1; then
            gh api --method PATCH "${tag_update_ref}" \
              -f "sha=${COMMIT_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref=refs/tags/nightly \
              -f "sha=${COMMIT_SHA}" >/dev/null
          fi

      # Immutable-release repos forbid adding assets to an already-published
      # release, so create/update it as a draft (assets allowed), replace the
      # assets, then promote it to a published release in the final step.
      - name: Replace nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          releases_api="repos/${REPOSITORY}/releases"
          release_id=""
          if release_id="$(gh api "${releases_api}/tags/nightly" --jq '.id' 2>/dev/null)"; then
            gh api --method PATCH "${releases_api}/${release_id}" \
              -f name="MarkText Nightly" \
              -F "body=@release_body.md" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false >/dev/null
          else
            release_id="$(gh api --method POST "${releases_api}" \
              -f tag_name=nightly \
              -f name="MarkText Nightly" \
              -F "body=@release_body.md" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false \
              --jq '.id')"
          fi

          asset_ids="$(gh api --paginate "${releases_api}/${release_id}/assets?per_page=100" --jq '.[].id')"
          while IFS= read -r asset_id; do
            if [[ -n "${asset_id}" ]]; then
              gh api --method DELETE "${releases_api}/assets/${asset_id}" >/dev/null
            fi
          done <<< "${asset_ids}"

          gh release upload nightly dist/* \
            --repo "${REPOSITORY}" \
            --clobber

          gh api --method PATCH "${releases_api}/${release_id}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
